<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="ps-frame" x1="16" y1="20" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ps-ghost" x1="48" y1="54" x2="98" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

  <!-- Outer prompt bubble within 10% margin [14, 114] -->
  <rect x="16" y="24" width="96" height="68" rx="18" stroke="url(#ps-frame)" stroke-width="7"/>
  <path d="M 38 92 L 32 108 L 54 92" stroke="url(#ps-frame)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Prompt chevron > -->
  <path d="M 32 48 L 44 58 L 32 68" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dimmed ghost suggestion lines -->
  <path d="M 52 54 H 96" stroke="url(#ps-ghost)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 52 68 H 82" stroke="url(#ps-ghost)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 7"/>

  <!-- Sparkle prediction accent -->
  <path d="M 98 30 L 101 37 L 108 40 L 101 43 L 98 50 L 95 43 L 88 40 L 95 37 Z" fill="#10b981"/>
</svg>
